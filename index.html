<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Video Promo Gratis</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col justify-between p-4 md:p-8">

  <!-- Header Promo Gratis -->
  <header class="max-w-6xl w-full mx-auto mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-gray-800 pb-4">
    <div>
      <h1 class="text-2xl font-bold text-blue-400">Katalog Video Promo</h1>
      <p class="text-sm text-gray-400">Pilih judul di daftar kanan untuk menonton cuplikan video secara gratis.</p>
    </div>
    <div class="bg-blue-900/40 border border-blue-500/30 text-blue-300 px-4 py-2 rounded-lg text-xs md:text-sm font-medium">
      ✨ Tonton Gratis
    </div>
  </header>

  <!-- Container Utama (Kotak 1 & Kotak 2) -->
  <main class="max-w-6xl w-full mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow">
    
    <!-- KOTAK 1: Video Player -->
    <section class="md:col-span-2 bg-black rounded-xl overflow-hidden border border-gray-800 flex flex-col justify-center items-center relative aspect-video">
      <iframe id="mainPlayer" src="" class="w-full h-full border-0" allow="autoplay" allowfullscreen></iframe>
      <div id="playerPlaceholder" class="absolute inset-0 flex items-center justify-center bg-gray-950 text-gray-500">
        Memuat video dari Google Drive...
      </div>
    </section>

    <!-- KOTAK 2: Daftar Video Google Drive -->
    <section class="bg-gray-800 rounded-xl p-4 border border-gray-700 flex flex-col h-[400px] md:h-auto">
      <h2 class="text-lg font-semibold mb-3 border-b border-gray-700 pb-2 flex justify-between items-center">
        <span>Daftar Video</span>
        <span id="videoCount" class="text-xs bg-blue-600 px-2 py-0.5 rounded-full text-white">0</span>
      </h2>
      
      <ul id="playlist" class="overflow-y-auto flex-grow space-y-2 pr-1 custom-scrollbar">
        <li class="text-sm text-gray-400 animate-pulse">Mengambil data dari Drive...</li>
      </ul>
    </section>

  </main>

  <!-- Footer -->
  <footer class="max-w-6xl w-full mx-auto text-center text-xs text-gray-500 mt-8">
    &copy; 2026 Platform Video Promo. Free Access Version.
  </footer>

  <script>
    // URL Script milik Anda sudah otomatis terpasang di sini
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyrqECNdNzqgwZ0yKt56n-5cUxIteliBnU7gRBAszDei91UGRU5yo-oB9gXT-qZHRDG/exec";

    const mainPlayer = document.getElementById('mainPlayer');
    const playerPlaceholder = document.getElementById('playerPlaceholder');
    const playlistContainer = document.getElementById('playlist');
    const videoCount = document.getElementById('videoCount');

    async function loadPlaylist() {
      try {
        const response = await fetch(GAS_API_URL);
        const json = await response.json();

        if (json.status === "success" && json.data.length > 0) {
          playlistContainer.innerHTML = "";
          videoCount.textContent = json.data.length;

          json.data.forEach((video, index) => {
            const li = document.createElement('li');
            li.className = `p-3 rounded-lg bg-gray-700/50 hover:bg-blue-600/30 border border-gray-600/30 cursor-pointer transition flex items-center gap-3 text-sm playlist-item`;
            li.setAttribute('data-id', video.id);
            li.innerHTML = `
              <span class="font-mono text-xs text-gray-400 w-6">${index + 1}.</span>
              <span class="truncate flex-grow font-medium">${video.name}</span>
              <span class="text-xs text-blue-400">▶ Putar</span>
            `;

            li.addEventListener('click', () => {
              playVideo(video.id, li);
            });

            playlistContainer.appendChild(li);
          });

          // Otomatis putar video pertama
          playVideo(json.data[0].id, playlistContainer.children[0]);

        } else {
          playlistContainer.innerHTML = `<li class="text-sm text-red-400">Tidak ada video ditemukan di folder.</li>`;
        }
      } catch (err) {
        console.error(err);
        playlistContainer.innerHTML = `<li class="text-sm text-red-400">Gagal memuat video. Periksa koneksi/konfigurasi.</li>`;
      }
    }

    function playVideo(driveId, element) {
      document.querySelectorAll('.playlist-item').forEach(el => {
        el.classList.remove('bg-blue-600', 'border-blue-400');
        el.classList.add('bg-gray-700/50');
      });
      element.classList.remove('bg-gray-700/50');
      element.classList.add('bg-blue-600', 'border-blue-400');

      playerPlaceholder.style.display = 'none';
      mainPlayer.src = `https://drive.google.com/file/d/${driveId}/preview`;
    }

    loadPlaylist();
  </script>
</body>
</html>
