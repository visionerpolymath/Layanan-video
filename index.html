<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layanan Video - Top Up Koin</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; }
    .balance-box { background: #f1f5f9; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
    .balance-title { color: #64748b; font-size: 14px; margin: 0 0 8px 0; font-weight: 600; }
    .balance-amount { font-size: 28px; font-weight: 800; color: #2563eb; margin: 0; }
    .device-id { font-size: 12px; color: #94a3b8; margin-top: 6px; }
    .section-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 16px; }
    .btn-pay { display: block; width: 100%; background: #2563eb; color: white; text-decoration: none; font-weight: 700; padding: 14px; border-radius: 12px; font-size: 16px; border: none; cursor: pointer; transition: background 0.2s; margin-bottom: 15px; }
    .btn-pay:hover { background: #1d4ed8; }
    iframe { width: 100%; height: 520px; border: 1px solid #e2e8f0; border-radius: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="balance-box">
      <p class="balance-title">Saldo Kamu</p>
      <p class="balance-amount">0 Koin</p>
      <div class="device-id">ID Perangkat: <span id="device-id">Memuat...</span></div>
    </div>

    <div class="section-title">Beli Koin via QRIS / Bank (Rupiah)</div>

    <!-- Tombol Utama untuk Pembayaran -->
    <a href="https://app.openpeer.xyz?currency=IDR&asset=USDT&address=0x61fc40493e894D80ee01CeECfcf5AEd8a687a5CC" target="_blank" class="btn-pay">
      💳 Klik Di Sini Bayar QRIS / Bank (IDR)
    </a>

    <!-- Widget Tampilan Lengkap -->
    <iframe src="https://app.openpeer.xyz?currency=IDR&asset=USDT&address=0x61fc40493e894D80ee01CeECfcf5AEd8a687a5CC" allow="camera; clipboard-write"></iframe>
  </div>

  <script>
    // Membuat ID Perangkat Otomatis Pembeli
    let devId = localStorage.getItem('user_device_id');
    if (!devId) {
      devId = 'ID-' + Math.random().toString(36).substring(2, 9).toUpperCase();
      localStorage.setItem('user_device_id', devId);
    }
    document.getElementById('device-id').innerText = devId;
  </script>

</body>
</html>
