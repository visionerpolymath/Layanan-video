<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layanan Video - Top Up Koin</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 460px; text-align: center; }
    
    .balance-box { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #bfdbfe; }
    .balance-title { color: #1e40af; font-size: 14px; margin: 0 0 6px 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .balance-amount { font-size: 32px; font-weight: 800; color: #1d4ed8; margin: 0; }
    .device-id { font-size: 12px; color: #64748b; margin-top: 8px; font-family: monospace; }

    .section-title { font-size: 16px; font-weight: 700; color: #334155; margin-bottom: 14px; text-align: left; }
    
    .btn-pay { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: #059669; color: white; text-decoration: none; font-weight: 700; padding: 14px; border-radius: 12px; font-size: 15px; border: none; cursor: pointer; transition: background 0.2s; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2); }
    .btn-pay:hover { background: #047857; }
    
    iframe { width: 100%; height: 580px; border: 1px solid #e2e8f0; border-radius: 16px; background: #ffffff; }
    .note { font-size: 12px; color: #94a3b8; margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Informasi Saldo -->
    <div class="balance-box">
      <p class="balance-title">Saldo Kamu</p>
      <p class="balance-amount">0 Koin</p>
      <div class="device-id">ID Perangkat: <span id="device-id">Memuat...</span></div>
    </div>

    <div class="section-title">Beli Koin via QRIS / Bank (IDR)</div>

    <!-- Tombol Buka Langsung (Jika Iframe Diblokir Layar HP) -->
    <a href="https://onramp.money/main/buy/?coinCode=usdt&fiatType=idr&network=polygon&walletAddress=0x61fc40493e894D80ee01CeECfcf5AEd8a687a5CC" target="_blank" class="btn-pay">
      📱 Klik Di Sini Bayar QRIS / e-Wallet (IDR)
    </a>

    <!-- Widget Embed Onramp Money -->
    <iframe src="https://onramp.money/main/buy/?coinCode=usdt&fiatType=idr&network=polygon&walletAddress=0x61fc40493e894D80ee01CeECfcf5AEd8a687a5CC" allow="camera; clipboard-write"></iframe>

    <div class="note">
      🔒 Pembayaran aman via Onramp Money.<br>Dukungan: QRIS, GoPay, ShopeePay, DANA, & Transfer Bank.
    </div>
  </div>

  <script>
    // Set ID Perangkat
    let devId = localStorage.getItem('user_device_id');
    if (!devId) {
      devId = 'ID-' + Math.random().toString(36).substring(2, 9).toUpperCase();
      localStorage.setItem('user_device_id', devId);
    }
    document.getElementById('device-id').innerText = devId;
  </script>

</body>
</html>
